name: serenity_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  uuid: ^4.0.0
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5
  http: ^1.2.0
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  google_sign_in: ^6.2.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  url_launcher: ^6.2.5
  google_fonts: ^6.2.1
  firebase_messaging: ^15.1.3
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.4
  cloud_firestore: ^5.6.12
  # Necesario para llamar a las Cloud Functions resolverCanal y videosDeCanal.
  # Se fija la línea 5.x porque la 6.x exige firebase_core ^4, y aquí estamos
  # en firebase_core ^3.8.1.
  cloud_functions: ^5.6.2
  crypto: ^3.0.3
  # Reproductor oficial de YouTube (IFrame API). Es la forma permitida de
  # reproducir videos y no se toca.
  youtube_player_flutter: ^9.0.2
  # ❌ ELIMINADO: youtube_explode_dart
  # Funcionaba haciendo ingeniería inversa de la API interna de YouTube, lo
  # que va contra los Términos de Servicio y se rompe cuando YouTube cambia.
  # Sustituido por la API oficial (YouTube Data v3) desde Cloud Functions.
  local_auth: ^2.3.0
  provider: ^6.1.2
  flutter_overlay_window: ^0.5.0
  flutter_foreground_task: 8.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_foreground: "assets/images/logo.png"
  adaptive_icon_background: "#0F172A"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/animales/
    - assets/images/icons/
    - assets/images/animales_con_acciones/