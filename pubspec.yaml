name: serenity_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  uuid: ^4.0.0
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5
  http: ^1.2.0
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  google_sign_in: ^6.2.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  url_launcher: ^6.2.5
  google_fonts: ^6.2.1
  firebase_messaging: ^15.1.3
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.4
  cloud_firestore: ^5.6.12
  # Necesario para llamar a las Cloud Functions resolverCanal y videosDeCanal.
  # Se fija la línea 5.x porque la 6.x exige firebase_core ^4, y aquí estamos
  # en firebase_core ^3.8.1.
  cloud_functions: ^5.6.2
  crypto: ^3.0.3
  # Reproductor oficial de YouTube (IFrame API). Es la forma permitida de
  # reproducir videos y no se toca.
  youtube_player_flutter: ^9.0.2
  # ❌ ELIMINADO: youtube_explode_dart
  # Funcionaba haciendo ingeniería inversa de la API interna de YouTube, lo
  # que va contra los Términos de Servicio y se rompe cuando YouTube cambia.
  # Sustituido por la API oficial (YouTube Data v3) desde Cloud Functions.
  local_auth: ^2.3.0
  # Reproduce el video de bienvenida que se ve la primera vez que se abre la
  # app. Es un archivo local del propio APK: no descarga nada ni necesita
  # internet, así que funciona aunque el usuario abra la app sin señal.
  video_player: ^2.8.6
  # Google Play Billing. Es el plugin oficial de Flutter; no se usó RevenueCat
  # ni similares porque el proyecto ya tiene Cloud Functions donde verificar la
  # compra, y un intermediario más significaría darle los datos de ingresos —y
  # eventualmente una comisión— a un tercero que aquí no aporta nada.
  in_app_purchase: ^3.2.0
  provider: ^6.1.2
  # ❌ ELIMINADAS: flutter_overlay_window y flutter_foreground_task
  #
  # Ninguna de las dos se importaba en un solo archivo de lib/. Pero sus
  # manifiestos SÍ se fusionaban con el de la app y le metían permisos:
  # SYSTEM_ALERT_WINDOW (dibujar sobre otras apps), FOREGROUND_SERVICE y
  # FOREGROUND_SERVICE_SPECIAL_USE.
  #
  # Esos permisos, junto a los de ubicación y cámara, hacían que Play
  # Protect bloqueara la instalación por parecerse a software espía. Y son
  # justo los que la revisión de Play mira con lupa en una app que maneja
  # datos de menores.
  #
  # Quitarlas de aquí es lo que de verdad los elimina: borrarlos del
  # AndroidManifest no sirve si el plugin los sigue declarando en el suyo,
  # porque la fusión de manifiestos vuelve a agregarlos.
  #
  # El modo kiosco no las usaba: funciona con startLockTask() del sistema,
  # a través del MethodChannel de MainActivity.kt.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_foreground: "assets/images/logo.png"
  adaptive_icon_background: "#0F172A"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    # ── FUENTES EMPAQUETADAS ────────────────────────────────────────────
    #
    # Sin esto, google_fonts DESCARGA Poppins por internet la primera vez
    # que se usa cada peso, y la guarda en el teléfono. Consecuencias:
    #
    #   · Un usuario nuevo sin señal veía la app con la fuente del sistema.
    #   · El primer arranque gastaba datos bajando tipografías.
    #   · El texto podía cambiar de forma a mitad de pantalla, al llegar la
    #     descarga y volver a pintar.
    #
    # Van declaradas aquí en `assets:` y NO en `fonts:` a propósito: así es
    # como google_fonts las encuentra —busca en el manifiesto de recursos
    # archivos con el patrón Poppins-<Variante>.ttf—. Puestas en `fonts:` no
    # las vería y seguiría descargándolas.
    #
    # Son exactamente los 7 pesos que usa la app, contados uno por uno sobre
    # las 413 llamadas a GoogleFonts.poppins() que hay en lib/. Empaquetar
    # los 18 que existen sumaría 2,8 MB al APK por variantes que nadie usa.
    - assets/google_fonts/
    # ⚠️ El video de bienvenida va en assets/video/intro.mp4
    #    Debe ser MP4 con H.264 + AAC: es lo único que reproducen TODOS los
    #    Android. Un MP4 con H.265/HEVC se ve en un teléfono nuevo y falla en
    #    uno de gama baja, que es justo el que más va a tener esta app.
    - assets/video/
    - assets/images/
    - assets/images/animales/
    - assets/images/icons/
    - assets/images/animales_con_acciones/
    # Las fotos de perfil que puede elegir el niño. Son PNG circulares de
    # 384 px con el fondo transparente; las seis juntas pesan 94 KB porque
    # van con paleta reducida — son dibujos planos y no pierden nada.
    - assets/images/avatares/